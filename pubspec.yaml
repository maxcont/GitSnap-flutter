name: gitsnap_flutter
description: GitSnap - Confronto ambienti Git tramite Azure DevOps
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  auto_updater: ^1.0.0
  
  # State management
  provider: ^6.1.1
  
  # HTTP client
  http: ^1.1.0
  
  # JSON serialization
  json_annotation: ^4.8.1
  
  # Local storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  
  # UUID generation
  uuid: ^4.2.1
  
  # Icons
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.6.0
  
  # UI components
  flutter_slidable: ^3.0.1
  intl: ^0.19.0
  url_launcher: ^6.2.0
  webview_windows: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/ico/ico_white.png
